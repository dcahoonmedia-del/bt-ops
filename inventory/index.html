<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>B&amp;T Product Inventory Reference</title>
    <meta
      name="description"
      content="Mobile inventory reference for B&amp;T Pest Control technicians — search products, check stock, and filter by category."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brandmark" aria-hidden="true">B&amp;T</div>
        <div>
          <p class="eyebrow">Technician field guide</p>
          <h1>Product Inventory</h1>
        </div>
      </header>

      <section class="safety">
        <strong>Reference only — not live stock.</strong>
        <span>Re-export from Sortly and re-import when counts change.</span>
      </section>

      <div class="search-wrap">
        <span aria-hidden="true">⌕</span>
        <input
          id="search"
          aria-label="Search products"
          placeholder="Search product name…"
          autocomplete="off"
        />
        <button id="clear-search" type="button" hidden aria-label="Clear search">×</button>
      </div>

      <div class="stats" id="stats" aria-live="polite"></div>

      <div class="filter-row" id="filters" role="toolbar" aria-label="Filter by category"></div>

      <div class="content">
        <section class="section-head">
          <div>
            <p class="eyebrow">Warehouse reference</p>
            <h2>What do we have?</h2>
          </div>
          <span id="result-count"></span>
        </section>

        <div class="product-list" id="product-list"></div>
        <p class="empty-state" id="empty-state" hidden>No products match your search.</p>
      </div>
    </main>

    <div class="sheet-backdrop" id="sheet-backdrop" hidden>
      <section class="detail-sheet" role="dialog" aria-modal="true" aria-labelledby="detail-title">
        <div class="grab" aria-hidden="true"></div>
        <button class="close" id="close-detail" type="button" aria-label="Close">×</button>
        <p class="eyebrow" id="detail-category"></p>
        <h2 id="detail-title"></h2>
        <div class="detail-grid" id="detail-body"></div>
      </section>
    </div>

    <script src="app.js" type="module"></script>
  </body>
</html>
